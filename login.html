<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AuthApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-wrapper">

    <!-- left side — branding panel -->
    <div class="left-panel">
      <div class="brand-box">
        <div class="brand-logo">🔐</div>
        <h1 class="brand-name">AuthApp</h1>
        <p class="brand-tagline">Welcome back!</p>

        <div class="features">
          <div class="feature-item">✅ Your data is encrypted and safe</div>
          <div class="feature-item">✅ Free to use forever</div>
          <div class="feature-item">✅ Access from any device</div>
        </div>
      </div>
    </div>

    <!-- right side — login form -->
    <div class="right-panel">
      <div class="form-box">

        <h2 class="form-title">Welcome Back</h2>
        <p class="form-sub">Login to access your account</p>

        <!-- email input -->
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" />
          <span class="error-msg" id="email-error"></span>
        </div>

        <!-- password input -->
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" />
          <span class="error-msg" id="pass-error"></span>
        </div>

        <!-- forgot password link -->
        <p class="forgot-link"><a href="#">Forgot your password?</a></p>

        <!-- login button -->
        <button class="btn-submit" onclick="handleLogin()">Login</button>

        <!-- error/success message -->
        <p class="success-msg" id="success-msg"></p>
        <p class="error-msg" id="login-error" style="text-align:center; margin-top:10px;"></p>

        <!-- link to signup page -->
        <p class="switch-link">
          Don't have an account? <a href="signup.html">Sign up here</a>
        </p>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
