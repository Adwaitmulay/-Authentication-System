<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — AuthApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- dashboard navbar -->
  <div class="dashboard-nav">
    <div class="brand-name-small">🔐 AuthApp</div>
    <button class="btn-logout" onclick="handleLogout()">Logout</button>
  </div>

  <!-- dashboard content -->
  <div class="dashboard-body">

    <!-- welcome card -->
    <div class="welcome-card">
      <div class="welcome-icon">👋</div>
      <h2 id="welcome-name">Welcome!</h2>
      <p id="welcome-email"></p>
      <p class="login-time" id="login-time"></p>
    </div>

    <!-- stats row — just UI, shows logged in user info -->
    <div class="stats-row">

      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-label">Account Status</div>
        <div class="stat-value">Active</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🔒</div>
        <div class="stat-label">Security</div>
        <div class="stat-value">Protected</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-label">Member Since</div>
        <div class="stat-value" id="member-since">Today</div>
      </div>

    </div>

    <!-- message -->
    <div class="info-box">
      <p>🎉 You have successfully logged in! This dashboard is protected — only logged in users can see this page.</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
